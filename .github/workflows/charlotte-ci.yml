name: Charlotte CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source present
        run: test -f charlotte_core_cloud_batch58/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run tests
        working-directory: charlotte_core_cloud_batch58
        run: python -m pytest -q
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK and install required platform
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools missing at $SDKMANAGER" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android source present
        run: test -f Charlotte_Android_Studio_Handoff/app/build.gradle.kts
      - name: Verify AndroidX configuration
        working-directory: Charlotte_Android_Studio_Handoff
        run: grep -Fxq 'android.useAndroidX=true' gradle.properties
      - name: Build debug APK
        working-directory: Charlotte_Android_Studio_Handoff
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-debug-apk
          path: Charlotte_Android_Studio_Handoff/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
