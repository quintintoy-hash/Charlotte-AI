name: Charlotte CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source present
        run: test -f charlotte_core_cloud_batch58/pyproject.toml
      - name: Install test dependencies
        working-directory: charlotte_core_cloud_batch58
        run: python -m pip install -e . pytest
      - name: Verify Python dependency compatibility
        run: python -m pip check
      - name: Run tests
        working-directory: charlotte_core_cloud_batch58
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest-console.log
      - name: Summarize Python results
        if: always()
        shell: bash
        run: |
          echo '## Charlotte Python checks' >> "$GITHUB_STEP_SUMMARY"
          if [ -f charlotte_core_cloud_batch58/pytest-results.xml ]; then
            echo 'Pytest XML report generated; consult job conclusion and attached diagnostics for pass/fail.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Pytest XML report missing: test execution may not have started.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Python test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-python-diagnostics
          path: |
            charlotte_core_cloud_batch58/pytest-results.xml
            charlotte_core_cloud_batch58/pytest-console.log
          if-no-files-found: warn
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK and install required platform
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools missing at $SDKMANAGER" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android source present
        run: test -f Charlotte_Android_Studio_Handoff/app/build.gradle.kts
      - name: Verify AndroidX configuration
        working-directory: Charlotte_Android_Studio_Handoff
        run: grep -Fxq 'android.useAndroidX=true' gradle.properties
      - name: Verify speech recognition service visibility
        working-directory: Charlotte_Android_Studio_Handoff
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          actions = manifest.findall("./queries/intent/action")
          assert any(action.get(android + "name") == "android.speech.RecognitionService" for action in actions), (
              "Android 11+ speech recognition service visibility declaration is missing"
          )
          print("Speech recognition service visibility verified")
          PY
      - name: Build debug APK
        working-directory: Charlotte_Android_Studio_Handoff
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log
      - name: Run Android unit tests
        working-directory: Charlotte_Android_Studio_Handoff
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee android-tests.log
      - name: Verify APK generated
        shell: bash
        run: |
          set -euo pipefail
          APK="Charlotte_Android_Studio_Handoff/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-debug-apk
          path: Charlotte_Android_Studio_Handoff/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Summarize Android results
        if: always()
        shell: bash
        run: |
          echo '## Charlotte Android checks' >> "$GITHUB_STEP_SUMMARY"
          APK='Charlotte_Android_Studio_Handoff/app/build/outputs/apk/debug/app-debug.apk'
          if [ -s "$APK" ]; then
            echo 'Debug APK file exists (not a release certification).' >> "$GITHUB_STEP_SUMMARY"
            sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No nonempty debug APK found.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Consult job conclusion and diagnostic artifacts for test results.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-android-diagnostics
          path: |
            Charlotte_Android_Studio_Handoff/android-build.log
            Charlotte_Android_Studio_Handoff/android-tests.log
            Charlotte_Android_Studio_Handoff/app/build/test-results/
            Charlotte_Android_Studio_Handoff/app/build/reports/tests/
            Charlotte_Android_Studio_Handoff/app/build/reports/problems/
          if-no-files-found: warn
          retention-days: 14
