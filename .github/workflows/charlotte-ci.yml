name: Charlotte CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check for recovered Python source
        id: source
        run: |
          if [ -d charlotte_core_cloud_batch58 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Recovered source has not been imported yet; tests skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Python tests
        if: steps.source.outputs.present == 'true'
        run: |
          python -m pip install pytest
          cd charlotte_core_cloud_batch58
          python -m pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android project
        id: android
        run: |
          if [ -f Charlotte_Android_Studio_Handoff/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Android wrapper not imported yet; Android build skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        if: steps.android.outputs.present == 'true'
        working-directory: Charlotte_Android_Studio_Handoff
        run: bash ./gradlew assembleDebug testDebugUnitTest --no-daemon
